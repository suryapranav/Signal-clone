# Render Blueprint for the backend (a single web service; the in-memory
# WebSocket registry requires exactly one instance).
services:
  - type: web
    name: signal-clone-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: CORS_ORIGINS
        value: http://localhost:3000
