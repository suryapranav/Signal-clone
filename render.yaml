# Render Blueprint for the backend (a single web service; the in-memory
# WebSocket registry requires exactly one instance).
services:
  - type: web
    name: signal-clone-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: CORS_ORIGINS
        value: http://localhost:3000
      # Postgres connection string (e.g. from Neon). Leave unset to use SQLite,
      # which Render's free tier wipes on every restart.
      - key: DATABASE_URL
        sync: false
